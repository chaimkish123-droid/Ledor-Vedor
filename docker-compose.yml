# The archive lives on the volume, never in the image: redeploying the
# application must never be able to touch the family's history.
services:
  ldor-vador:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - family-archive:/data
    environment:
      # Every one of these has a working default; they are here to be found.
      LDOR_DATA_DIR: /data
      LDOR_BACKUP_DIR: /data/backups
      LDOR_BACKUP_HOURS: '24'
      LDOR_BACKUP_KEEP: '14'
      # Uncomment while trying this out on your own machine over http://localhost,
      # where some browsers refuse to keep a login on a plain http:// address.
      # Take it out again before putting this on the internet.
      # LDOR_COOKIE_SECURE: 'false'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  family-archive:
