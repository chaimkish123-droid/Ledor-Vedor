# Fly.io. Create the volume before the first deploy:
#   fly volumes create family_archive --size 3
# Three gigabytes is generous for a family of a few hundred with photographs.

app = "ldor-vador"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LDOR_DATA_DIR = "/data"
  LDOR_BACKUP_DIR = "/data/backups"

[[mounts]]
  source = "family_archive"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The archive must not be stopped and started underneath people: a machine
  # that suspends mid-write is a machine writing to a database mid-write.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
